name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Repo hygiene guard
        run: bash scripts/check_tracked_runtime_artifacts.sh

      - name: Lint
        run: uv run ruff check src tests

      - name: Typecheck
        run: uv run basedpyright

      - name: Test
        run: uv run pytest -q
