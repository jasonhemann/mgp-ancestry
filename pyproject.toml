[project]
name = "genealogy-tree"
version = "0.1.0"
description = "Builds a math genealogy tree for a given user"
authors = [
    {name = "Jason Hemann", email = "jason.hemann@gmail.com"},
]
dependencies = ["beautifulsoup4>=4.12.3", "requests>=2.32.3"]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
genealogy-tree = "genealogy_tree.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --cov=src/genealogy_tree --cov-report=term-missing"

[tool.coverage.run]
source = ["src/genealogy_tree"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == '__main__':",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "C90", "SIM", "RET", "N", "Q", "RUF", "PT", "D"]
ignore = [
    "C401",
    "C416",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D205",
    "D203",
    "D213",
    "E501",
    "I001",
    "RUF022",
    "Q003",
    "UP017",
    "UP035",
    "UP037",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "recommended"
venvPath = "."
venv = ".venv"


[dependency-groups]
dev = [
    "basedpyright>=1.24.0",
    "lmql>=0.7.3",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.0",
    "types-requests>=2.32.4.20250611",
]
